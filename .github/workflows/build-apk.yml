name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Go binary (ARM64)
      run: |
        cd nas-server
        export CGO_ENABLED=0
        export GOOS=android
        export GOARCH=arm64
        go build -ldflags="-s -w" -o nas-server .

    - name: Build APK
      working-directory: apk-build
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NAS-PrivateCloud-APK
        path: apk-build/app/build/outputs/apk/release/*.apk
  
